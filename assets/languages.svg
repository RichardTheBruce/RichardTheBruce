<svg xmlns="http://www.w3.org/2000/svg" width="840" height="290" viewBox="0 0 840 290" role="img">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C97D3E"/><stop offset="1" stop-color="#E3A468"/></linearGradient>
  <style>
    .t{font-family:-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;fill:#F5F2EC} .m{font-family:'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace;fill:#9A948A;letter-spacing:.08em;text-transform:uppercase}
    .rise{opacity:0;animation:rise .7s ease-out forwards}
    @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    .bar{transform-box:fill-box;transform-origin:bottom;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
    .hbar{transform-box:fill-box;transform-origin:left;animation:hgrow .9s cubic-bezier(.2,.8,.2,1) both}
    @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
    @keyframes hgrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  </style>
</defs>
<rect x=".5" y=".5" width="839" height="289" rx="14" fill="#141414" stroke="#2A2723"/>
<text x="32" y="38" class="m" font-size="11">Languages  ·  repos that use them  ·  public + private</text>
<text x="32" y="77" class="t" font-size="14" font-weight="600">TypeScript</text>
<rect class="hbar" style="animation-delay:0.00s" x="150" y="66" width="580" height="14" rx="7" fill="url(#g)" opacity="1.00"/>
<text x="740" y="78" class="m" font-size="11">38 repos</text>
<text x="32" y="107" class="t" font-size="14" font-weight="600">JavaScript</text>
<rect class="hbar" style="animation-delay:0.07s" x="150" y="96" width="427" height="14" rx="7" fill="#C97D3E" opacity="0.93"/>
<text x="587" y="108" class="m" font-size="11">28 repos</text>
<text x="32" y="137" class="t" font-size="14" font-weight="600">Python</text>
