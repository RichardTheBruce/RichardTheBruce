<svg xmlns="http://www.w3.org/2000/svg" width="840" height="250" viewBox="0 0 840 250" role="img">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C97D3E"/><stop offset="1" stop-color="#E3A468"/></linearGradient>
  <style>
    .t{font-family:-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;fill:#F5F2EC} .m{font-family:'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace;fill:#9A948A;letter-spacing:.08em;text-transform:uppercase}
    .rise{opacity:0;animation:rise .7s ease-out forwards}
    @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    .bar{transform-box:fill-box;transform-origin:bottom;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
    .hbar{transform-box:fill-box;transform-origin:left;animation:hgrow .9s cubic-bezier(.2,.8,.2,1) both}
    @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
    @keyframes hgrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  </style>
</defs>
<rect x=".5" y=".5" width="839" height="249" rx="14" fill="#141414" stroke="#2A2723"/>
<text x="32" y="44" class="m" font-size="11">Commits authored since Apr 2024  ·  public + private</text>
<g class="rise"><text x="30" y="128" class="t" font-size="88" font-weight="760" letter-spacing="-3"><tspan style="fill:url(#g)" fill="url(#g)">4,900</tspan><tspan dx="18" font-size="26" font-weight="500" letter-spacing="0" fill="#F5F2EC">commits</tspan></text></g>
<line x1="32" y1="150" x2="808" y2="150" stroke="#2A2723"/>
<g class="rise" style="animation-delay:0.35s">
  <text x="32" y="192" class="t" font-size="24" font-weight="650">5,734</text>
  <text x="32" y="212" class="m" font-size="10">contributions</text></g><line x1="187" y1="168" x2="187" y2="214" stroke="#2A2723"/><g class="rise" style="animation-delay:0.43s">
  <text x="201" y="192" class="t" font-size="24" font-weight="650">4,044</text>
  <text x="201" y="212" class="m" font-size="10">commits in 2026</text></g><line x1="342" y1="168" x2="342" y2="214" stroke="#2A2723"/><g class="rise" style="animation-delay:0.51s">
  <text x="356" y="192" class="t" font-size="24" font-weight="650">332</text>
  <text x="356" y="212" class="m" font-size="10">active days</text></g><line x1="498" y1="168" x2="498" y2="214" stroke="#2A2723"/><g class="rise" style="animation-delay:0.59s">
  <text x="512" y="192" class="t" font-size="24" font-weight="650">26</text>
  <text x="512" y="212" class="m" font-size="10">day best streak</text></g><line x1="653" y1="168" x2="653" y2="214" stroke="#2A2723"/><g class="rise" style="animation-delay:0.67s">
  <text x="667" y="192" class="t" font-size="24" font-weight="650">363</text>
  <text x="667" y="212" class="m" font-size="10">on the busiest day</text></g>
</svg>
